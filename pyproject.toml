[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faceai"
version = "0.1.0"
description = "Contactless health screening from facial video using remote photoplethysmography (rPPG)"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "Proprietary - NTU veNTUre x NHG Health x A*STAR IHPC research collaboration" }

# ---------------------------------------------------------------------------
# EXACT pins, read back from `pip freeze` on the environment that was actually
# built on 2026-09-10 - not the versions that were intended. Every number below
# was verified installed and importable. See README.md for the full record.
#
# NOTE: torch/torchvision/torchaudio carry the +cu130 local version identifier
# and resolve ONLY from https://download.pytorch.org/whl/cu130 (see [tool.uv]
# below, or the --extra-index-url line in requirements.txt).
# ---------------------------------------------------------------------------
dependencies = [
    # --- numerical core (numpy pinned <2.3 deliberately; see README) ---------
    "numpy==2.2.6",
    "scipy==1.18.1",
    "pandas==2.3.3",
    "matplotlib==3.11.1",
    "scikit-learn==1.9.0",

    # --- deep learning (CUDA 13.0 build, sm_120 Blackwell) -------------------
    "torch==2.14.0+cu130",
    "torchvision==0.29.0+cu130",
    "torchaudio==2.11.0+cu130",

    # --- computer vision -----------------------------------------------------
    # EXACTLY ONE OpenCV variant. contrib is used (not opencv-python) because
    # mediapipe 1.0.1 hard-depends on opencv-contrib-python; contrib is a strict
    # superset with the same GUI build, so cv2.imshow still works.
    "opencv-contrib-python==5.0.0.93",
    "mediapipe==1.0.1",

    # --- rPPG signal processing ---------------------------------------------
    "heartpy==1.2.7",
    "neurokit2==0.2.13",

    # --- video I/O -----------------------------------------------------------
    "av==18.1.0",
    "decord==0.6.0",
    "imageio==2.37.4",
    "imageio-ffmpeg==0.6.0",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab==4.6.3",
    "ipykernel==7.3.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
